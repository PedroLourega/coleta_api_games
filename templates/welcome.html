<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bem-vindo | YourSpace</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"

<body>
    <div class="welcome-screen">
        <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

        <h1>YourSpace</h1>

        <p>Seu espaço pessoal para acompanhar jogos: notícias, promoções da sua lista de desejos e suas próprias
            análises.</p>

        <div class="welcome-actions">
            <a href="{{ url_for('login') }}" class="btn btn-ghost">Entrar</a>
            <a href="{{ url_for('registrar') }}" class="btn btn-primary">Criar conta</a>
        </div>
