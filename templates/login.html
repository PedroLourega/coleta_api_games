<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | YourSpace</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body>
    <div class="fullscreen-center">
        <div class="floating-card">
            <a href="{{ url_for('welcome') }}" class="brand">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7l10 5 10-5-10-5z" fill="#04101F" />
                    </svg>
                </span>
                YourSpace
            </a>

            <h1>Bem-vindo de volta</h1>
            <p>Entre pra ver suas promoções e sua lista de desejos.</p>

            {% with mensagens = get_flashed_messages() %}
            {% if mensagens %}
            <div class="flash-messages">
                {% for msg in mensagens %}
                <div class="flash">{{ msg }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autofocus />
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required />
                </div>
                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            </form>

            <p class="auth-switch">Ainda não tem conta? <a href="{{ url_for('registrar') }}">Criar conta</a></p>
        </div>
    </div>
</body>

</html>
